<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Service - Amazon Enquiry</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #eaeded; color: #0f1111; }
        .navbar { background-color: #131921; color: white; display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; }
        .logo { font-size: 1.4rem; font-weight: bold; color: #ff9900; text-decoration: none; }
        .sub-nav { background-color: #232f3e; color: white; padding: 8px 20px; display: flex; gap: 20px; font-size: 0.9rem; }
        .sub-nav a { color: white; text-decoration: none; }
        .sub-nav a:hover, .sub-nav a.active { color: #febd69; font-weight: bold; }
        .container { max-width: 600px; margin: 30px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { margin-bottom: 10px; font-size: 1.6rem; }
        p { color: #555; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; font-size: 0.9rem; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #a6a6a6; border-radius: 4px; font-size: 1rem; }
        input:focus, textarea:focus { outline: none; border-color: #e77600; box-shadow: 0 0 3px 2px rgb(228 121 17 / 50%); }
        button { background-color: #ffd814; border: 1px solid #fcd200; border-radius: 8px; padding: 10px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #f7ca00; }
        .success-msg { display: none; background: #d4edda; color: #155724; padding: 12px; border-radius: 4px; text-align: center; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">amazon.in<span style="font-size:0.7rem; color:white;">⚡BT-Store</span></a>
    </header>

    <nav class="sub-nav">
        <a href="index.html">All Bluetooth Gadgets</a>
        <a href="about.html">About Store</a>
        <a href="enquiry.html" class="active">Customer Enquiry</a>
    </nav>

    <div class="container">
        <h1>Amazon Customer Help & Support</h1>
        <p>Need assistance with a Bluetooth order or device compatibility? Submit your query below.</p>

        <form id="enquiry-form" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" required placeholder="Enter full name">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label for="order">Order ID (Optional)</label>
                <input type="text" id="order" placeholder="e.g. 403-1234567-8901234">
            </div>
            <div class="form-group">
                <label for="message">Describe Your Issue</label>
                <textarea id="message" rows="4" required placeholder="Mention pairing problems, battery issues, etc."></textarea>
            </div>
            <button type="submit">Send Enquiry to Support</button>
        </form>

        <div id="success" class="success-msg">Your enquiry has been received! Amazon Support will contact you within 24 hours.</div>
    </div>

    <script>
        function handleSubmit(e) {
            e.preventDefault();
            document.getElementById('enquiry-form').style.display = 'none';
            document.getElementById('success').style.display = 'block';
        }
    </script>
</body>
</html>
